[project]
site_name = "Mathematical Notes"
site_description = "A personal mathematical notebook."
site_url = "https://example.github.io/"
site_dir = "dist"
extra_css = ["stylesheets/notes.css"]
extra_javascript = ["javascripts/mathjax.js", "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js", "javascripts/notes.js"]
nav = [{"Journal" = "index.md"}, {"By subject" = "subjects.md"}, {"Statement index" = "statements.md"}, {"About" = "about.md"}]
copyright = "Mathematical Notes"

[project.theme]
variant = "classic"
custom_dir = "overrides"
font = false
features = ["navigation.tabs", "navigation.tabs.sticky", "navigation.top", "search.suggest", "search.highlight"]

[project.theme.palette]
scheme = "default"
primary = "white"
accent = "indigo"

[project.plugins.search]
[project.plugins.blog]
blog_dir = "."
post_url_format = "{date}/{slug}"
post_excerpt = "required"
post_readtime = false
archive_date_format = "yyyy"
archive_url_format = "archive/{date}"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
footnotes = {}
[project.markdown_extensions.toc]
permalink = "¶"
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
