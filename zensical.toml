[project]
site_name = "Mathematical Notes"
site_description = "A personal mathematical notebook."
site_url = "https://example.github.io/"
site_dir = "dist"
extra_css = ["stylesheets/notes.css"]
extra_javascript = ["javascripts/mathjax.js", "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js", "javascripts/notes.js"]
nav = [
  { "Differential Geometry" = [
    { "1. Connections and Curvature" = [
      { "Introduction" = "diff-geo/1/index.md" },
      { "1.1. Connections" = [
        "diff-geo/1/1.md",
      ] },
    ] },
  ] },
]
copyright = "Mathematical Notes"

[project.theme]
variant = "classic"
custom_dir = "overrides"
font = false
features = ["navigation.indexes", "navigation.top", "search.suggest", "search.highlight", "toc.follow"]

[project.theme.palette]
scheme = "default"
primary = "white"
accent = "indigo"

[project.plugins.search]
[project.markdown_extensions]
attr_list = {}
md_in_html = {}
footnotes = {}
[project.markdown_extensions.toc]
permalink = "¶"
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
